<main>

<header>

<h1>⚡ 電験実務トレーニング</h1>

<div class="sub">電験三種合格後の「現場で使う知識」を身につける</div>

</header>

<section id="home" class="card home">

<span class="badge">全50問・実務基礎</span>

<h2>10問トレーニング</h2>

<p>

全50問の中から毎回ランダムで10問出題します。<br>

受変電・モーター・保護・測定・保全などを実務目線で確認します。

</p>

<button class="start" onclick="startQuiz()">10問スタート</button>

<div class="small">

※これは学習用の試作品です。実際の操作・保安判断は、勤務先の手順書・保安規程・法令等を優先してください。

</div>

</section>

<section id="quiz" style="display:none">

<div class="card">

<div class="qnum" id="qnum"></div>

<div class="progress">

<div class="bar" id="bar"></div>

</div>

<div class="question" id="question"></div>

<div id="choices"></div>

<div class="explain" id="explain"></div>

<button class="next" id="next" onclick="nextQ()">次の問題 →</button>

</div>

</section>

<span class="badge">トレーニング終了</span>

<h2>今回の結果</h2>

<button class="start" onclick="startQuiz()">もう一度挑戦</button>

</section>

</main>

<script>

const questions = [

/* ===== 受変電 ===== */

{

category:"受変電",

q:"VCB（真空遮断器）の主な役割として最も適切なのは？",

c:["電圧を変換する","事故電流などを遮断する","力率を改善する","接地抵抗を測定する"],

a:1,

e:"VCBは高圧回路の開閉・遮断を行う機器です。保護継電器が事故を検出し、遮断指令を出してVCBが回路を遮断する、という関係を理解しておくことが重要です。"

},

{

category:"受変電",

q:"高圧受電設備のPASについて、一般的な役割として最も適切なのは？",

c:["構内と電力会社側の境界付近で高圧回路を開閉・保護する","低圧電圧を100Vに変換する","モーターの回転数を制御する","電力量を計測する"],

a:0,

e:"PASは受電点付近に設置される高圧の開閉器です。構内事故による波及事故を防ぐ目的などで使用され、SOG制御装置などと組み合わせて使われる設備もあります。"

},

{

category:"受変電",

q:"OCR（過電流継電器）が主に検出するものは？",

c:["過電流","過電圧","漏水","温度だけ"],

a:0,

e:"OCRはOver Current Relayの略で、設定値を超える電流を検出する保護継電器です。実務ではCTからの入力や整定値、遮断器との保護協調も重要になります。"

},

{

category:"受変電",

q:"GR（地絡継電器）が主に検出する事故は？",

c:["地絡","過電圧","周波数低下","力率低下"],

a:0,

e:"GRは地絡事故を検出する保護継電器です。ZCTなどから地絡電流を検出する仕組みを理解しておくと、受変電設備全体の保護の考え方が分かりやすくなります。"

},

{

category:"受変電",

q:"CT（変流器）の主な役割は？",

c:["大電流を測定・保護継電器入力に適した電流へ変換する","高電圧を低電圧へ変換する","電力を蓄える","周波数を変える"],

a:0,

e:"CTは一次側の大電流を、計測器や保護継電器が扱いやすい電流へ変換します。電流計測だけでなく保護継電器の入力としても重要です。"

},

{

category:"受変電",

q:"VT（計器用変圧器）の主な役割として適切なのは？",

c:["高電圧を計測・保護に適した電圧へ変換する","大電流を遮断する","モーターを冷却する","接地抵抗を下げる"],

a:0,

e:"VTは高電圧を計測器や保護継電器が扱える電圧へ変換するために使用されます。CTが電流、VTが電圧という基本的な役割の違いを整理しておきましょう。"

},

{

category:"受変電",

q:"高圧受電設備で絶縁抵抗を測定する主な目的は？",

c:["絶縁状態を確認する","電力量を測る","力率を改善する","遮断器の速度を測る"],

a:0,

e:"絶縁抵抗測定は電路や機器の絶縁状態を確認するために行います。測定値だけでなく、過去値との比較や測定条件も含めて判断することが重要です。"

},

{

category:"受変電",

q:"変圧器が電圧を変えるときに利用している原理は？",

c:["電磁誘導","静電気だけ","熱膨張","化学反応"],

a:0,

e:"変圧器は電磁誘導を利用して電圧を変換します。実務では容量、一次・二次電圧、負荷電流、油温、異音・異臭などを関連づけて確認します。"

},

{

category:"受変電",

q:"変圧器の負荷電流が以前より大きくなっている場合、最初に考えるべきことは？",

c:["負荷設備や運転状況に変化がないか確認する","必ず変圧器が故障したと判断する","電圧を適当に変更する","記録する必要はない"],

a:0,

e:"電流増加だけで変圧器故障とは断定できません。負荷設備の増加や運転状態、時間帯などを確認し、過去データと比較することが基本です。"

},

{

category:"受変電",

q:"高圧設備の点検で異常な『うなり音』が聞こえた場合、最も適切なのは？",

c:["音だけで原因を断定せず、設備・負荷・温度などを確認する","必ず正常なので放置する","すぐに全設備を分解する","音がしたら必ず全設備を停電すると判断する"],

a:0,

e:"異音は重要な兆候ですが、原因は負荷状態、磁気的な振動、締結状態、機械的な異常など様々です。音・温度・電流・過去記録などを組み合わせて判断します。"

},

/* ===== モーター ===== */

{

category:"モーター",

q:"三相誘導電動機の運転中、電流が以前より増加している場合、まず確認したいのは？",

c:["負荷側の運転状態","必ず絶縁破壊と判断する","モーターの銘板を捨てる","接地線を外して確認する"],

a:0,

e:"モーター電流の増加には負荷増大、機械側の異常、電源状態など様々な原因があります。電流だけで原因を決めつけず、負荷や温度、振動などと合わせて確認します。"

},

{

category:"モーター",

q:"モーターの軸受温度が以前より高くなってきた場合、重要な確認項目は？",

c:["温度の推移、潤滑状態、振動、負荷など","モーターの塗装色だけ","電源周波数を勝手に変更する","必ず温度計を撤去する"],

a:0,

e:"軸受温度は単発の数値だけでなく、上昇傾向を見ることが重要です。潤滑状態、振動、負荷、周囲温度などを合わせて確認します。"

},

{

category:"モーター",

q:"電動機から異常な振動が発生している場合、原因として考えられるものは？",

c:["軸受や芯ずれ、アンバランス、機械側の異常など","必ず電圧不足だけ","必ず絶縁抵抗の低下だけ","必ず周波数がゼロになったため"],

a:0,

e:"振動の原因は電気側だけとは限りません。軸受、芯ずれ、回転体のアンバランス、カップリング、機械側など幅広く考える必要があります。"

},

{

category:"モーター",

q:"電動機の銘板を確認する目的として、実務上特に重要なのは？",

c:["定格電圧・電流・出力・周波数などの仕様を確認する","製造会社の住所だけを見る","色だけで容量を判断する","銘板は確認しなくてもよい"],

a:0,

e:"銘板には定格電圧、電流、出力、周波数、回転数など重要な情報があります。点検や異常調査では実機の仕様確認が基本になります。"

},

{

category:"モーター",

q:"モーターのブラシ交換を行う設備で、ブラシの異常摩耗が見られた場合に重要なのは？",

c:["摩耗状態だけでなく、接触状態や火花、整流子なども確認する","新品に交換すれば原因確認は不要","ブラシを削って短くする","異常摩耗は必ず正常"],

a:0,

e:"ブラシの摩耗状態だけでなく、接触状態、火花、整流子の状態などを合わせて見ることが重要です。交換後も再発していないか確認します。"

},

{

category:"モーター",

q:"モーターの運転音が以前より大きくなった場合、最も適切な考え方は？",

c:["音の変化を記録し、振動・温度・電流などと合わせて原因を調べる","音量だけで故障箇所を断定する","必ず正常なので無視する","すぐに分解して内部を確認する"],

a:0,

e:"異音は設備状態の変化を示す可能性があります。音だけで判断せず、振動、温度、電流、負荷状態などと関連づけて確認します。"

},

{

category:"モーター",

q:"モーターの絶縁抵抗が過去の記録より低下していた場合、重要なのは？",

c:["過去値との比較や測定条件を確認し、原因を調査する","1回低下しただけで必ず故障と断定する","測定値を記録しない","低下したら必ず測定器を交換する"],

a:0,

e:"絶縁抵抗は経年変化や温湿度などの影響も受けます。単純に1回の数値だけで判断せず、過去値や測定条件と比較することが重要です。"

},

{

category:"モーター",

q:"モーターの冷却が悪化すると、一般的にどのような影響が考えられる？",

c:["温度上昇によって絶縁や軸受などに悪影響が出る可能性がある","必ず回転数が2倍になる","必ず電流がゼロになる","設備への影響はない"],

a:0,

e:"電動機は発熱するため、適切な冷却が重要です。温度上昇が続けば絶縁や軸受などの寿命にも影響する可能性があります。"

},

{

category:"モーター",

q:"モーターの点検で『いつもと違う』という感覚を記録する意味は？",

c:["異常の初期兆候を過去記録と比較する手がかりになる","感覚的な情報には価値がない","記録すると設備が故障する","数値測定はすべて不要になる"],

a:0,

e:"音、振動、におい、温度などの変化は異常の早期発見につながることがあります。感覚だけで判断せず、可能な範囲で数値化・記録することが重要です。"

},

/* ===== 保護・安全 ===== */

{

category:"保護・安全",

q:"電気設備の異常を発見したとき、主任技術者として重要な考え方は？",

c:["安全を確保し、状況を確認・記録し、必要な対応につなげる","経験だけで原因を決めつける","記録は不要","異常が小さければ必ず放置する"],

a:0,

e:"実務では『異常を発見→安全確保→状況確認→記録→必要な措置・報告』という流れが重要です。具体的な対応は設備や保安規程によって変わります。"

},

{

category:"保護・安全",

q:"年次点検などで停電作業を行う際、最も重要な考え方は？",

c:["作業範囲と電源を明確にし、所定の安全手順を確実に行う","ブレーカーを1つ切れば十分","検電は省略できる","作業者の判断だけで手順を変更する"],

a:0,

e:"停電作業では対象範囲の明確化、開閉器操作、施錠・表示、検電、必要な接地など、現場で定められた安全手順を確実に実施することが重要です。"

},

{

category:"保護・安全",

q:"保護継電器の整定値を確認する際、重要なのは？",

c:["設備の仕様や保護協調などを考慮して確認する","数値を小さくすれば必ず安全になる","数値は適当に変更してよい","整定値は確認する必要がない"],

a:0,

e:"保護継電器の整定は設備容量や系統、下位保護との協調などを考慮する必要があります。現場で勝手に変更せず、所定の手順・管理方法に従います。"

},

{

category:"保護・安全",

q:"電気事故が発生した場合、原因究明より先に優先すべきことは？",

c:["人身安全の確保と二次災害の防止","原因を推測してSNSに投稿する","設備をすぐ分解する","記録を削除する"],

a:0,

e:"事故対応ではまず人身安全と二次災害防止が優先されます。その後、事業場の緊急時手順などに従って連絡・状況確認・記録などを行います。"

},

{

category:"保護・安全",

q:"電気設備の点検記録を残す目的として最も重要なのは？",

c:["設備状態の変化を追跡し、異常の早期発見や保全判断に役立てる","紙を増やすことだけが目的","過去の記録は不要","記録は異常が起きた後だけでよい"],

a:0,

e:"点検記録は設備の状態を時系列で比較するための重要な資料です。温度、電流、絶縁抵抗、振動などの変化から異常兆候を把握できます。"

},

{

category:"保護・安全",

q:"電気設備の作業前に、作業者同士で作業内容を確認する主な目的は？",

c:["作業範囲・危険箇所・役割などを共有し、認識違いを防ぐ","作業時間を長くする","責任を曖昧にする","確認事項を減らす"],

a:0,

e:"作業前の打合せやKYは、作業範囲、危険ポイント、役割などを共有するために重要です。特に電気設備では『どこまでが作業対象か』の認識が重要になります。"

},

{

category:"保護・安全",

q:"『停電しているはず』という思い込みだけで電気設備に触れることについて、最も適切なのは？",

c:["思い込みに頼らず、所定の確認手順を実施する","経験者なら確認不要","表示だけ見れば十分","他の人が停電したと言えば確認不要"],

a:0,

e:"電気作業では思い込みが重大事故につながる可能性があります。現場で定められた手順に従い、対象設備の状態を確認することが基本です。"

},

/* ===== 測定・点検 ===== */

{

category:"測定・点検",

q:"設備の温度を定期的に記録する場合、単発の値より重要なことは？",

c:["過去の値と比較して変化や傾向を見る","一番高い値だけ記録する","温度は記録しない","毎回測定条件を変える"],

a:0,

e:"設備点検ではトレンド管理が重要です。同じ設備の過去値と比較することで、徐々に進行する異常を発見できる場合があります。"

},

{

category:"測定・点検",

q:"絶縁抵抗測定の結果を比較するとき、考慮すべきものは？",

c:["測定箇所・測定条件・過去値など","測定した人の身長だけ","天気は絶対に関係ない","数値だけ見れば十分"],

a:0,

e:"絶縁抵抗は測定条件の影響を受けるため、測定箇所や条件を揃えて過去値と比較することが重要です。"

},

{

category:"測定・点検",

q:"クランプメータで運転中のモーター電流を見る目的として適切なのは？",

c:["運転状態や負荷の変化を把握する手がかりにする","絶縁抵抗を直接測定する","接地抵抗を直接測定する","電圧を必ずゼロにする"],

a:0,

e:"クランプメータによる電流測定は、運転状態や負荷の変化を確認する手がかりになります。電流値だけで原因を断定せず、他の情報と合わせて判断します。"

},

{

category:"測定・点検",

q:"三相モーターの各相電流を測定して大きなアンバランスがあった場合、考えるべきことは？",

c:["電源側・接続・モーター・負荷などを確認する","必ず正常と判断する","1相だけ意図的に外す","測定値を消去する"],

a:0,

e:"三相電流のアンバランスには電源、接続、モーター内部、負荷など複数の要因が考えられます。測定条件も確認しながら原因を切り分けます。"

},

{

category:"測定・点検",

q:"点検中に測定値が突然大きく変化した場合、まず確認したいことは？",

a:0,

e:"異常値が出た場合は、設備異常だけでなく測定器や測定方法、測定箇所なども確認します。再現性や他のデータとの整合性を見ることが重要です。"

},

{

/* ===== クイズ用変数 ===== */

let quizQuestions = [];

let currentChoices = [];

let idx = 0;

let score = 0;

let answered = false;

/* ===== シャッフル ===== */

function shuffle(array){

  const arr = [...array];

  for(let i = arr.length - 1; i > 0; i--){

    const j = Math.floor(Math.random() * (i + 1));

    [arr[i], arr[j]] = [arr[j], arr[i]];

  }

  return arr;

}

/* ===== クイズ開始 ===== */

function startQuiz(){

  idx = 0;

  score = 0;

  quizQuestions = shuffle(questions).slice(0,10);

  document.getElementById("home").style.display = "none";

  document.getElementById("result").style.display = "none";

  document.getElementById("quiz").style.display = "block";

  showQ();

}

/* ===== 問題表示 ===== */

function showQ(){

  answered = false;

  const x = quizQuestions[idx];

  document.getElementById("qnum").textContent =

    `第${idx + 1}問 / ${quizQuestions.length}`;

  document.getElementById("bar").style.width =

    `${(idx + 1) / quizQuestions.length * 100}%`;

  document.getElementById("question").textContent = x.q;

  /* 選択肢もシャッフル */

  currentChoices = x.c.map((text,i)=>({

    text:text,

    correct:i === x.a

  }));

  currentChoices = shuffle(currentChoices);

  const box = document.getElementById("choices");

  box.innerHTML = "";

  currentChoices.forEach((choice,i)=>{

    const b = document.createElement("button");

    b.className = "choice";

    b.textContent =

      `${String.fromCharCode(65+i)}　${choice.text}`;

    b.onclick = () => answer(i,b);

    box.appendChild(b);

  });

  document.getElementById("explain").style.display = "none";

  document.getElementById("next").style.display = "none";

}

/* ===== 回答 ===== */

function answer(i,clicked){

  if(answered) return;

  answered = true;

  const choice = currentChoices[i];

  const correctIndex =

    currentChoices.findIndex(v => v.correct);

  if(choice.correct){

    score++;

    clicked.classList.add("correct");

  }else{

    clicked.classList.add("wrong");

  }

  [...document.querySelectorAll(".choice")]

    .forEach((b,n)=>{

      if(n === correctIndex){

        b.classList.add("correct");

      }

      b.disabled = true;

    });

  const x = quizQuestions[idx];

  document.getElementById("explain").innerHTML =

    `<b>${choice.correct ? "正解！" : "不正解"}</b><br>${x.e}`;

  document.getElementById("explain").style.display = "block";

  document.getElementById("next").style.display = "block";

}

/* ===== 次の問題 ===== */

function nextQ(){

  idx++;

  if(idx < quizQuestions.length){

    showQ();

  }else{

    document.getElementById("quiz").style.display = "none";

    document.getElementById("result").style.display = "block";

    document.getElementById("score").textContent =

      `${score} / ${quizQuestions.length}`;

    if(score >= 9){

      document.getElementById("message").textContent =

        "かなり良いです。正解だけでなく、なぜその判断になるのかまで説明できるか意識しましょう。";

    }else if(score >= 7){

      document.getElementById("message").textContent =

        "基礎はできています。間違えた問題の理由を確認して、現場の設備と結びつけて覚えていきましょう。";

    }else{

      document.getElementById("message").textContent =

        "まずは基礎固め。設備の名前・役割・異常時の考え方を現場の機器と結びつけて覚えていきましょう。";

    }

  }

}
