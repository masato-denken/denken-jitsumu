<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>⚡ 電験実務トレーニング</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f3f4f6;color:#111827;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif}
main{max-width:680px;margin:auto;min-height:100vh;padding:20px 16px 40px}
header{padding:12px 4px 20px}
h1{font-size:24px;margin:0 0 6px}
.sub{color:#6b7280;font-size:14px}
.card{background:white;border-radius:18px;padding:20px;box-shadow:0 3px 14px #0000000d;margin-bottom:14px}
.badge{display:inline-block;background:#eef2ff;border-radius:999px;padding:6px 10px;font-size:12px;font-weight:700}
.progress{height:8px;background:#e5e7eb;border-radius:99px;overflow:hidden;margin:14px 0 20px}
.bar{height:100%;background:#111827;width:0%;transition:.25s}
.qnum{font-size:13px;color:#6b7280;font-weight:700}
.question{font-size:19px;line-height:1.55;font-weight:700;margin:8px 0 18px}
.choice{display:block;width:100%;text-align:left;background:#fff;border:1px solid #d1d5db;border-radius:13px;padding:14px;margin:9px 0;font-size:16px;line-height:1.45}
.choice:active{transform:scale(.99)}
.choice.correct{border:2px solid #16a34a;background:#f0fdf4}
.choice.wrong{border:2px solid #dc2626;background:#fef2f2}
.explain{display:none;margin-top:18px;padding:15px;background:#f9fafb;border-radius:13px;line-height:1.65;font-size:14px}
button.next{display:none;width:100%;border:0;border-radius:13px;padding:15px;background:#111827;color:#fff;font-size:16px;font-weight:700;margin-top:14px}
.home{text-align:center}
.start{width:100%;border:0;border-radius:14px;padding:16px;background:#111827;color:#fff;font-size:17px;font-weight:700}
.small{font-size:12px;color:#6b7280;line-height:1.6;margin-top:12px}
.result{text-align:center}
.score{font-size:48px;font-weight:800;margin:8px}
</style>
</head>
<body>
<main>
<header>
<h1>⚡ 電験実務トレーニング</h1>
<div class="sub">電験三種合格後の「現場で使う知識」を身につける</div>
</header>

<section id="home" class="card home">
<span class="badge">受変電設備・実務基礎</span>
<h2>まずは10問</h2>
<p>VCB・PAS・OCR・GR・変圧器など、主任技術者として知っておきたい基礎を確認します。</p>
<button class="start" onclick="startQuiz()">10問スタート</button>
<div class="small">※これは学習用の試作品です。実際の操作・保安判断は、勤務先の手順書・保安規程・法令等を優先してください。</div>
</section>

<section id="quiz" style="display:none">
<div class="card">
<div class="qnum" id="qnum"></div>
<div class="progress"><div class="bar" id="bar"></div></div>
<div class="question" id="question"></div>
<div id="choices"></div>
<div class="explain" id="explain"></div>
<button class="next" id="next" onclick="nextQ()">次の問題 →</button>
</div>
</section>

<section id="result" class="card result" style="display:none">
<span class="badge">トレーニング終了</span>
<h2>今回の結果</h2>
<div class="score" id="score"></div>
<p id="message"></p>
<button class="start" onclick="startQuiz()">もう一度挑戦</button>
</section>
</main>

<script>
const questions=[
{q:"VCB（真空遮断器）の主な役割として最も適切なのは？",
c:["電圧を変換する","事故電流などを遮断する","力率を改善する","接地抵抗を測定する"],a:1,
e:"VCBは高圧回路を開閉・遮断する機器です。OCRやGRなどの保護継電器が事故を検出し、遮断指令を出してVCBが回路を遮断する、という組み合わせを理解しておくと実務につながります。"},
{q:"高圧受電設備のPASについて、一般的な役割として最も適切なのは？",
c:["構内と電力会社側の境界付近で高圧回路を開閉・保護する","低圧電圧を100Vに変換する","モーターの回転数を制御する","電力量を計測する"],a:0,
e:"PAS（気中負荷開閉器）は受電点付近に設置され、構内側の事故による波及事故を防ぐ目的などで使われます。実設備ではSOG制御装置などとの組み合わせも確認します。"},
{q:"OCR（過電流継電器）が検出するものは？",
c:["過電流","過電圧","漏水","温度だけ"],a:0,
e:"OCRはOver Current Relay。設定値を超える電流を検出し、遮断器へトリップ指令を出す保護継電器です。実務ではCTからの電流入力や整定値も重要になります。"},
{q:"GR（地絡継電器）が主に検出する事故は？",
c:["地絡","過電圧","周波数低下","力率低下"],a:0,
e:"GRは地絡事故を検出する保護継電器です。地絡電流を検出するため、ZCTなどとの組み合わせを理解しておくとよいです。"},
{q:"CT（変流器）の主な役割は？",
c:["大電流を測定・保護継電器入力に適した電流へ変換する","高電圧を低電圧へ変換する","電力を蓄える","周波数を変える"],a:0,
e:"CTは一次側の大電流を、計測器や継電器が扱える電流に変換します。保護継電器が正常に働くためにも重要な機器です。"},
{q:"高圧受電設備で絶縁抵抗を測定する主な目的は？",
c:["絶縁状態を確認する","電力量を測る","力率を改善する","遮断器の速度を測る"],a:0,
e:"絶縁抵抗測定は、電路や機器の絶縁状態を確認するために行います。数値だけを見るのではなく、過去値との比較、測定箇所、温湿度なども含めて判断することが実務上重要です。"},
{q:"変圧器が『電圧を変える』ときに利用している原理は？",
c:["電磁誘導","静電気だけ","熱膨張","化学反応"],a:0,
e:"変圧器は電磁誘導を利用して電圧を変換します。実務では容量、一次・二次電圧、油温、負荷電流、異音・異臭などを関連づけて見ることが重要です。"},
{q:"高圧設備の点検で、異常な『うなり音』が聞こえた場合、最も適切なのは？",
c:["音だけで原因を断定せず、設備・負荷・温度などを確認する","必ず正常なので放置する","すぐに全設備を分解する","音がしたら必ず停電しないといけないと判断する"],a:0,
e:"異音は重要な兆候ですが、原因は負荷状態、磁気的な振動、締結状態、機械的異常など様々です。音・温度・電流・過去記録などを組み合わせ、必要に応じて専門業者へ確認を依頼します。"},
{q:"電気設備の異常を発見したとき、主任技術者として重要な考え方は？",
c:["安全を確保し、状況を確認・記録し、必要な対応につなげる","経験だけで原因を決めつける","記録は不要","異常が小さければ必ず放置する"],a:0,
e:"主任技術者の実務では『異常を見つける→安全確保→状況確認→記録→必要な措置・報告』という流れが重要です。具体的な対応は設備・保安規程・事故状況によって変わります。"},
{q:"年次点検などで停電作業を行う際、最も重要な考え方は？",
c:["作業範囲と電源を明確にし、停電・検電・接地などを含む所定の安全手順を確実に行う","ブレーカーを1つ切れば十分","検電は省略できる","作業者の判断だけで手順を変更する"],a:0,
e:"停電作業では、対象範囲の明確化、開閉器操作、施錠・表示、検電、必要な接地など、現場の安全手順を確実に実施することが重要です。実際には事業場の保安規程・作業手順を必ず優先します。"}
];

let idx=0,score=0,answered=false;
function startQuiz(){idx=0;score=0;document.getElementById("home").style.display="none";document.getElementById("result").style.display="none";document.getElementById("quiz").style.display="block";showQ()}
function showQ(){
 answered=false;
 const x=questions[idx];
 document.getElementById("qnum").textContent=`第${idx+1}問 / ${questions.length}`;
 document.getElementById("bar").style.width=`${idx/questions.length*100}%`;
 document.getElementById("question").textContent=x.q;
 const box=document.getElementById("choices");box.innerHTML="";
 x.c.forEach((t,i)=>{const b=document.createElement("button");b.className="choice";b.textContent=`${String.fromCharCode(65+i)}　${t}`;b.onclick=()=>answer(i,b);box.appendChild(b)});
 document.getElementById("explain").style.display="none";
 document.getElementById("next").style.display="none";
}
function answer(i,clicked){
 if(answered)return;answered=true;
 const x=questions[idx];
 if(i===x.a){score++;clicked.classList.add("correct")}else{clicked.classList.add("wrong")}
 [...document.querySelectorAll(".choice")].forEach((b,n)=>{if(n===x.a)b.classList.add("correct");b.disabled=true});
 document.getElementById("explain").innerHTML=`<b>${i===x.a?"正解！":"不正解"}</b><br>${x.e}`;
 document.getElementById("explain").style.display="block";
 document.getElementById("next").style.display="block";
}
function nextQ(){
 idx++;
 if(idx<questions.length)showQ();
 else{
  document.getElementById("quiz").style.display="none";
  document.getElementById("result").style.display="block";
  document.getElementById("score").textContent=`${score} / ${questions.length}`;
  document.getElementById("message").textContent=score>=9?"かなり良いです。実務判断の理由まで説明できるかを意識しましょう。":score>=7?"基礎はできています。間違えた分野を重点的に復習しましょう。":"まずは基礎固め。設備の名前と役割を現場の機器と結びつけて覚えていきましょう。";
 }
}
</script>
</body>
</html>
